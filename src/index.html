<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OnePage</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">OnePage</span>
      </div>

      <div class="controls">
        <label class="field">
          <span>Margins</span>
          <select id="margin">
            <option value="10">Narrow · 10mm</option>
            <option value="15" selected>Normal · 15mm</option>
            <option value="20">Wide · 20mm</option>
            <option value="25">Extra · 25mm</option>
          </select>
        </label>

        <label class="field">
          <span>Typeface</span>
          <select id="typeface">
            <option value="sans" selected>Calibri</option>
            <option value="arial">Arial</option>
            <option value="serif">Georgia</option>
            <option value="times">Times New Roman</option>
            <option value="narrow">Arial Narrow</option>
            <option value="mono">Courier New</option>
          </select>
        </label>

        <label class="field">
          <span>Columns</span>
          <select id="columns">
            <option value="auto" selected>Auto</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </label>

        <label class="field field-check">
          <input type="checkbox" id="fill" checked />
          <span>Fill page</span>
        </label>

        <span class="field-sep" aria-hidden="true"></span>

        <label class="field">
          <span>Font</span>
          <div class="font-size-controls">
            <button type="button" id="font-down" class="btn-icon" title="Decrease font size">A−</button>
            <span class="font-size-val" id="font-size-val">11</span>
            <button type="button" id="font-up" class="btn-icon" title="Increase font size">A+</button>
          </div>
        </label>

        <label class="field">
          <span>Highlight</span>
          <div class="highlight-controls">
            <input
              type="color"
              id="hl-color"
              value="#ffe066"
              class="color-pick"
              title="Background colour for the selected text"
            />
            <input
              type="number"
              id="hl-pad"
              class="pad-input"
              min="0"
              max="20"
              step="1"
              value="4"
              title="Padding around the highlighted text"
            />
            <button type="button" id="hl-apply" class="btn-icon" title="Highlight the selected text">Apply</button>
            <button type="button" id="hl-clear" class="btn-icon" title="Remove highlighting from the selection">Clear</button>
          </div>
        </label>

        <label class="field">
          <span>Page</span>
          <input type="color" id="bg-color" value="#ffffff" class="color-pick" title="Page background colour" />
        </label>

        <span class="field-sep" aria-hidden="true"></span>

        <button type="button" id="btn-image" class="btn" title="Add an image (or paste or drop one)">Image</button>
        <input type="file" id="image-file" accept="image/*" multiple hidden />
      </div>

      <div class="actions">
        <button type="button" id="btn-docx" class="btn">Word</button>
        <button type="button" id="btn-pdf" class="btn">PDF</button>
        <button type="button" id="btn-print" class="btn btn-primary">Print</button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane pane-source">
        <div class="pane-head">
          <h2>Source</h2>
          <button type="button" id="btn-clear" class="link-btn">Clear</button>
        </div>
        <textarea
          id="source"
          spellcheck="false"
          placeholder="Paste anything here — a Word document, an email, notes, a report.&#10;&#10;It will be rebuilt as a clean document and scaled to fit exactly one A4 page.&#10;&#10;Images: paste one, drop one anywhere, or click Image. It lands where the caret is, and the text flows around it.&#10;&#10;Highlight: select some text, pick a colour, press Apply."
        ></textarea>
      </section>

      <section class="pane pane-preview" id="preview">
        <div class="sheet-scaler" id="scaler">
          <iframe id="sheet" title="A4 preview" scrolling="no"></iframe>

          <!--
            Image chrome. It lives beside the sheet rather than inside it, so
            nothing the user grabs can end up in the printed page, but inside
            the scaler, so it can be positioned in the sheet's own coordinates.
            The controls undo the scaler's zoom with --inv-scale.
          -->
          <div class="img-overlay" id="img-overlay" hidden>
          <div class="img-overlay-frame" id="img-frame">
            <button type="button" class="img-handle" id="img-handle" title="Drag to resize" aria-label="Resize image"></button>
          </div>
          <div class="img-tools" id="img-tools" role="toolbar" aria-label="Image">
            <button type="button" class="img-tool" data-align="left" title="Align left">&#9612;</button>
            <button type="button" class="img-tool" data-align="center" title="Align centre">&#9608;</button>
            <button type="button" class="img-tool" data-align="right" title="Align right">&#9616;</button>
            <span class="img-tool-sep"></span>
            <input type="range" class="img-width" id="img-width" min="10" max="100" step="1" title="Width" />
            <span class="img-width-val" id="img-width-val">62%</span>
            <span class="img-tool-sep"></span>
            <button type="button" class="img-tool img-tool-danger" id="img-remove" title="Remove image">&#10005;</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="status" id="status">
      <span class="status-item" id="stat-words">0 words</span>
      <span class="status-sep" aria-hidden="true"></span>
      <span class="status-item" id="stat-size">—</span>
      <span class="status-sep" aria-hidden="true"></span>
      <span class="status-item" id="stat-layout">—</span>
      <span class="status-flex"></span>
      <span class="status-note" id="stat-note"></span>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
